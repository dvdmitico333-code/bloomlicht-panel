<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Generar link de validación · Bloomlicht Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --charcoal:#1A1A1A;--linen:#F5F4EF;--gold:#C6A87B;--ink:#2b2a27;
    --muted:#8a857c;--line:#e3e0d7;--card:#fffdf9;
    --shadow:0 1px 2px rgba(26,26,26,.04),0 8px 30px rgba(26,26,26,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--linen);color:var(--charcoal);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:30px 18px 80px}
  header{text-align:center;margin-bottom:6px}
  .word{font-family:'Fraunces',serif;font-weight:500;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:26px;letter-spacing:-.01em;margin:6px 0 2px}
  .sub{color:var(--muted);font-size:13px;margin:0}
  .rule{display:flex;align-items:center;justify-content:center;gap:9px;margin:14px auto 22px;max-width:220px}
  .rule .ln{height:1px;background:var(--gold);flex:1;opacity:.6}
  .rule .dot{width:5px;height:5px;border-radius:50%;background:var(--gold)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 20px}
  label{display:block;font-size:12px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin:14px 0 5px;font-weight:600}
  label:first-of-type{margin-top:0}
  input,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-family:inherit;font-size:14.5px;color:var(--charcoal)}
  input:focus,select:focus{outline:none;border-color:var(--gold)}
  input[readonly]{background:var(--linen);color:var(--muted)}
  .hint{font-size:12px;color:var(--muted);margin:5px 0 0}
  .btn{width:100%;margin-top:20px;background:var(--gold);color:var(--charcoal);border:none;border-radius:11px;padding:14px;font-family:inherit;font-weight:600;font-size:15px;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.dark{background:var(--charcoal);color:var(--linen);text-decoration:none;display:inline-block;text-align:center}

  .loadclientes{font-size:12.5px;color:var(--muted);margin:5px 0 0}

  /* Result */
  .result{margin-top:18px;background:var(--card);border:1px solid var(--gold);border-radius:16px;box-shadow:var(--shadow);padding:22px 20px;display:none}
  .result.show{display:block}
  .r-title{font-family:'Fraunces',serif;font-weight:500;font-size:20px;margin:0 0 2px}
  .r-marca{color:var(--muted);font-size:13px;margin:0 0 16px}
  .linkbox{background:var(--linen);border:1px solid var(--line);border-radius:10px;padding:12px 14px;word-break:break-all;font-size:13.5px;margin-bottom:10px}
  .linkbox a{color:var(--charcoal);text-decoration:none}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .actions>*{flex:1;min-width:130px;padding:12px;border-radius:10px;font-weight:600;font-size:14px;text-align:center;cursor:pointer;border:none}
  .msg{background:var(--linen);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:14px;position:relative}
  .msg .cp{position:absolute;top:8px;right:8px;font-size:11px;color:var(--gold);cursor:pointer;background:none;border:none;font-weight:600}
  .meta{font-size:12px;color:var(--muted);text-align:center;margin:0}
  .warm{color:var(--gold)}
  .err{color:#a3543f;font-size:13px;margin-top:12px;text-align:center}
  footer{text-align:center;color:var(--muted);font-size:11px;margin-top:30px;letter-spacing:.04em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="word">Bloomlicht Atelier</div>
    <h1>Generar link de validación</h1>
    <p class="sub">Elige al cliente, genera el link y compártelo. Expira en 14 días.</p>
    <div class="rule"><span class="ln"></span><span class="dot"></span><span class="ln"></span></div>
  </header>

  <div class="panel">
    <label for="cliente">Cliente</label>
    <select id="cliente"><option value="manual">— Escribir manualmente —</option></select>
    <p class="loadclientes" id="loadc">Cargando clientes…</p>

    <label for="marca">Marca o proyecto</label>
    <input id="marca" type="text" placeholder="Ej. Grillmaster by Oscar" />

    <label for="idp">ID de proyecto (submissionId)</label>
    <input id="idp" type="text" placeholder="Se llena solo al elegir cliente · vacío si es manual" />

    <label for="contacto">Nombre del contacto</label>
    <input id="contacto" type="text" placeholder="Ej. Oscar" />

    <label for="whatsapp">WhatsApp del contacto</label>
    <input id="whatsapp" type="text" inputmode="numeric" placeholder="10 dígitos, o con 52" />
    <p class="hint">Opcional. Se usa para el botón de WhatsApp.</p>

    <label for="gen">Generado por</label>
    <select id="gen">
      <option>David</option><option>Ángel</option><option>Montse</option><option>Paola</option>
    </select>

    <button class="btn" id="go">Generar link</button>
    <p class="err" id="err" style="display:none"></p>
  </div>

  <div class="result" id="result">
    <p class="r-title">Link listo</p>
    <p class="r-marca" id="r-marca"></p>
    <div class="linkbox"><a id="r-link" href="#" target="_blank" rel="noopener"></a></div>
    <div class="actions">
      <button class="btn" style="margin:0" id="copy">Copiar link</button>
      <a class="btn dark" style="margin:0" id="wa" href="#" target="_blank" rel="noopener">Enviar por WhatsApp</a>
    </div>
    <div class="msg">
      <button class="cp" id="copymsg">copiar</button>
      <span id="r-msg"></span>
    </div>
    <p class="meta"><span id="warm" class="warm">Pre-cargando el resumen del cliente…</span><br><span id="r-exp"></span></p>
  </div>

  <footer>Bloomlicht Atelier · uso interno</footer>
</div>

<script>
  const API_GEN     = "https://n8n.bloomlichtatelier.com/webhook/generar-link";
  const API_BANDEJA = "https://n8n.bloomlichtatelier.com/webhook/bandeja-data";
  const WARM_BASE   = "https://n8n.bloomlichtatelier.com/webhook/validacion-full?token=";

  let CLIENTES = [];

  const $ = id => document.getElementById(id);
  function msgTexto(contacto, link){
    return "Hola " + (contacto||"") + ", te comparto el resumen de tu marca para que lo revises y confirmes con calma. Ábrelo aquí: " + link + " . Cualquier ajuste lo haces ahí mismo.";
  }
  function waNumero(raw){
    let d = (raw||"").replace(/\D/g,"");
    if(!d) return "";
    if(d.length === 10) d = "52" + d;        // 10 dígitos -> +52
    else if(d.indexOf("52") !== 0) d = "52" + d;
    return d;
  }

  async function cargarClientes(){
    try{
      const res = await fetch(API_BANDEJA);
      const data = await res.json();
      CLIENTES = (data.cases||[]).map(c=>({
        id:c.submission_id, marca:c.marca, responsable:c.responsable, contacto:c.contacto
      }));
      const sel = $("cliente");
      CLIENTES.forEach((c,i)=>{
        const o = document.createElement("option");
        o.value = String(i);
        o.textContent = (c.marca||"(sin marca)") + (c.responsable?(" — "+c.responsable):"");
        sel.appendChild(o);
      });
      $("loadc").textContent = CLIENTES.length + " cliente(s) cargado(s) del intake.";
    }catch(e){
      $("loadc").textContent = "No se pudo cargar la lista (puedes seguir en modo manual).";
    }
  }

  $("cliente").addEventListener("change", e=>{
    const v = e.target.value;
    if(v==="manual"){ $("marca").value=""; $("idp").value=""; $("contacto").value=""; return; }
    const c = CLIENTES[Number(v)];
    if(!c) return;
    $("marca").value = c.marca||"";
    $("idp").value = c.id||"";
    $("contacto").value = c.contacto||c.responsable||"";
  });

  $("go").addEventListener("click", async ()=>{
    const marca = $("marca").value.trim();
    $("err").style.display="none";
    if(!marca){ $("err").textContent="Falta la marca o proyecto."; $("err").style.display="block"; return; }
    $("go").disabled = true; $("go").textContent = "Generando…";
    try{
      const res = await fetch(API_GEN, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          marca: marca,
          id_proyecto: $("idp").value.trim(),
          contacto: $("contacto").value.trim(),
          whatsapp: $("whatsapp").value.trim(),
          generado_por: $("gen").value
        })
      });
      if(!res.ok) throw new Error("HTTP "+res.status);
      const d = await res.json();
      mostrar(d);
    }catch(e){
      $("err").textContent = "No se pudo generar el link. "+e.message;
      $("err").style.display="block";
    }finally{
      $("go").disabled = false; $("go").textContent = "Generar link";
    }
  });

  function mostrar(d){
    const contacto = $("contacto").value.trim();
    const msg = msgTexto(contacto, d.link);
    $("r-marca").textContent = d.marca || "";
    $("r-link").textContent = d.link;
    $("r-link").href = d.link;
    $("r-msg").textContent = msg;
    $("r-exp").textContent = "Expira el " + (d.fecha_expiracion||"—") + " · registrado en Tokens_Log";
    const num = waNumero($("whatsapp").value);
    const wa = $("wa");
    if(num){ wa.href = "https://wa.me/"+num+"?text="+encodeURIComponent(msg); wa.style.display=""; }
    else { wa.href="#"; wa.style.opacity=".5"; wa.style.pointerEvents="none"; }
    $("copy").onclick = ()=>navigator.clipboard.writeText(d.link).then(()=>{$("copy").textContent="Copiado ✓"; setTimeout(()=>$("copy").textContent="Copiar link",1500);});
    $("copymsg").onclick = ()=>navigator.clipboard.writeText(msg).then(()=>{$("copymsg").textContent="copiado ✓"; setTimeout(()=>$("copymsg").textContent="copiar",1500);});
    $("result").classList.add("show");
    $("result").scrollIntoView({behavior:"smooth", block:"start"});
    // pre-carga del resumen para que el cliente lo abra al instante
    try{
      fetch(WARM_BASE + encodeURIComponent(d.token))
        .then(()=>{ $("warm").textContent = "Resumen pre-cargado ✓ — el cliente lo abrirá al instante"; })
        .catch(()=>{ $("warm").textContent = ""; });
    }catch(e){ $("warm").textContent=""; }
  }

  cargarClientes();
</script>
</body>
</html>
